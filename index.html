<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nexus Log</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="tsparticles"></div>
<!-- NAVBAR -->
<nav class="navbar navbar-dark fixed-top px-4 py-3">
      <span class="navbar-brand fw-light tracking-wide">
        <span class="accent-text">N</span>EXUS <span class="accent-text">L</span>OG
      </span>
    <div class="d-flex gap-4 align-items-center">
        <a
                href="#"
                data-section="log"
                class="nav-link small text-uppercase ls-wide"
        >
            <i class="bi bi-clock-history me-1"></i>Timeline
        </a>
        <button
                class="btn btn-amber btn-sm text-uppercase ls-wide"
                data-section="add-entry"
        >
            <i class="bi bi-plus me-1"></i>New Entry
        </button>
    </div>
</nav>

<!-- HERO BANNER (Log view only) -->
<div id="hero-banner" class="hero-banner d-flex align-items-end">
    <div class="container-fluid px-5 pb-5">
        <p class="hero-eyebrow text-uppercase ls-wide mb-2">
            Personal Observation Log
        </p>
        <h1 class="hero-title">
            The Sacred<br/><span class="accent-text">Timeline</span>
        </h1>
        <p class="hero-sub mt-3 col-md-5">
            Every glance at the sky is a branch event. Log it before the TVA
            prunes it.
        </p>
    </div>
</div>

<!-- SECTION 1: LOG VIEW -->
<section id="log" class="page-section active">
    <div class="container-fluid px-4 px-md-5 py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="section-label mb-0">
                <i class="bi bi-grid-3x3-gap me-2"></i>ALL OBSERVATIONS
            </p>
            <div class="d-flex gap-2">
                <button class="btn btn-filter btn-sm active" data-filter="all">
                    All
                </button>
                <button class="btn btn-filter btn-sm" data-filter="galaxy">
                    Galaxy
                </button>
                <button class="btn btn-filter btn-sm" data-filter="nebula">
                    Nebula
                </button>
                <button class="btn btn-filter btn-sm" data-filter="star">
                    Star
                </button>
                <button class="btn btn-filter btn-sm" data-filter="planet">
                    Planet
                </button>
            </div>
        </div>
        <div id="entries-grid" class="row g-3"></div>
        <div id="no-entries" class="text-center py-5 d-none">
            <i class="bi bi-telescope display-4 text-muted"></i>
            <p class="mt-3 text-muted small text-uppercase ls-wide">
                No observations logged yet.<br/>The timeline awaits.
            </p>
            <button class="btn btn-amber mt-3" data-section="add-entry">
                Begin Logging
            </button>
        </div>
    </div>
</section>

<!-- SECTION 2: ADD ENTRY -->
<section id="add-entry" class="page-section">
    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <p class="section-label mb-4">
                    <i class="bi bi-pencil me-2"></i>NEW OBSERVATION
                </p>
                <div class="form-card p-4 p-md-5">
                    <div class="mb-4">
                        <label class="form-label-custom">Object Name</label>
                        <input
                                type="text"
                                id="object-name"
                                class="form-control form-control-dark"
                                placeholder="e.g. Andromeda Galaxy, Orion Nebula"
                        />
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Object Type</label>
                        <select id="object-type" class="form-select form-control-dark">
                            <option value="">— Select type —</option>
                            <option value="galaxy">Galaxy</option>
                            <option value="nebula">Nebula</option>
                            <option value="star">Star</option>
                            <option value="planet">Planet</option>
                            <option value="cluster">Cluster</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Observation Date</label>
                        <input
                                type="date"
                                id="obs-date"
                                class="form-control form-control-dark"
                        />
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Your Notes</label>
                        <textarea
                                id="obs-notes"
                                class="form-control form-control-dark"
                                rows="4"
                                placeholder="Conditions, equipment, what you saw..."
                        ></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom"
                        >Location <span class="text-muted">(optional)</span></label
                        >
                        <input
                                type="text"
                                id="obs-location"
                                class="form-control form-control-dark"
                                placeholder="e.g. Rooftop, Dark sky site, Backyard"
                        />
                    </div>

                    <div class="d-flex gap-3 mt-5">
                        <button
                                id="save-entry-btn"
                                class="btn btn-amber flex-grow-1 py-2 text-uppercase ls-wide"
                        >
                            <i class="bi bi-check2 me-2"></i>Log Observation
                        </button>
                        <button class="btn btn-outline-secondary" data-section="log">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- SECTION 3: ENTRY DETAIL -->
<section id="entry-detail" class="page-section">
    <div id="entry-detail-container" class="container-fluid"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
